<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="alternate" type="application/json" title="{{ site.title }}" href="{{ "/posts.json" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ "/" | relative_url }}">
        <span class="brand-dot"></span>{{ site.title }}
      </a>
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}">首页</a>
        <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
        <a href="{{ "/posts.json" | relative_url }}">JSON</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.author | default: site.title }}</span>
      <a href="{{ site.url }}" target="_blank" rel="noopener">GitHub Pages</a>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" aria-label="回到顶部">↑</button>

  <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
</body>
</html>
